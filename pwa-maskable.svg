<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 512 512 width=512 height=512>
  <defs>
    <linearGradient id=bgGradMask x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#1a0b2e/>
      <stop offset=50% stop-color=#120722/>
      <stop offset=100% stop-color=#09090b/>
    </linearGradient>
    <linearGradient id=primaryPurpleMask x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#c084fc/>
      <stop offset=50% stop-color=#8b5cf6/>
      <stop offset=100% stop-color=#4f46e5/>
    </linearGradient>
    <linearGradient id=waveGradMask x1=0% y1=100% x2=0% y2=0%>
      <stop offset=0% stop-color=#c4b5fd/>
      <stop offset=50% stop-color=#ffffff/>
      <stop offset=100% stop-color=#f5f3ff/>
    </linearGradient>
    <radialGradient id=glowRadialMask cx=50% cy=50% r=50%>
      <stop offset=0% stop-color=#7c3aed stop-opacity=0.3/>
      <stop offset=100% stop-color=#09090b stop-opacity=0/>
    </radialGradient>
  </defs>

  <!-- Full Bleed Background for Safe Zone Clipping -->
  <rect width=512 height=512 fill=url(#bgGradMask)/>
  <circle cx=256 cy=256 r=210 fill=url(#glowRadialMask)/>
  <circle cx=256 cy=256 r=195 fill=none stroke=url(#primaryPurpleMask) stroke-width=4 stroke-opacity=0.4/>

  <!-- Content centered strictly within 80% Safe Zone (radius < 200px) -->
  <g transform=translate(0, -10)>
    <!-- Book Wings Silhouette -->
    <path d=M 148 295 C 190 282 226 290 256 308 C 286 290 322 282 364 295 L 364 175 C 322 162 286 170 256 188 C 226 170 190 162 148 175 Z fill=#240c4a fill-opacity=0.8 stroke=url(#primaryPurpleMask) stroke-width=4.5/>

    <!-- Equalizer Sound Wave Bars -->
    <g fill=url(#waveGradMask)>
      <rect x=168 y=200 width=16 height=75 rx=8/>
      <rect x=198 y=170 width=16 height=135 rx=8/>
      <rect x=228 y=140 width=16 height=195 rx=8/>
      <rect x=258 y=150 width=16 height=175 rx=8/>
      <rect x=288 y=180 width=16 height=115 rx=8/>
      <rect x=318 y=210 width=16 height=55 rx=8/>
    </g>
  </g>

  <!-- Centered Safe Monogram -->
  <text x=256 y=380 font-family=-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif font-size=34 font-weight=900 fill=#ffffff text-anchor=middle letter-spacing=5>ENRESUMIDO</text>
</svg>
