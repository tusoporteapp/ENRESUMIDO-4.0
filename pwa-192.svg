<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 192 192 width=192 height=192>
  <defs>
    <linearGradient id=bgGrad192 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#1e1035/>
      <stop offset=100% stop-color=#09090b/>
    </linearGradient>
    <linearGradient id=primaryPurple192 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#a78bfa/>
      <stop offset=50% stop-color=#7c3aed/>
      <stop offset=100% stop-color=#4f46e5/>
    </linearGradient>
    <linearGradient id=waveGrad192 x1=0% y1=100% x2=0% y2=0%>
      <stop offset=0% stop-color=#c4b5fd/>
      <stop offset=50% stop-color=#ffffff/>
      <stop offset=100% stop-color=#ede9fe/>
    </linearGradient>
    <filter id=glow192 x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=6 result=blur />
      <feComposite in=SourceGraphic in2=blur operator=over />
    </filter>
  </defs>

  <!-- Outer container -->
  <rect width=192 height=192 rx=44 fill=url(#bgGrad192)/>
  <rect x=3 y=3 width=186 height=186 rx=41 fill=none stroke=url(#primaryPurple192) stroke-width=2.5 stroke-opacity=0.6/>

  <!-- Ambient glow in center -->
  <circle cx=96 cy=92 r=48 fill=#7c3aed opacity=0.18 filter=url(#glow192)/>

  <!-- Stylized Monogram ER + Book Spine Base -->
  <g transform=translate(0, -6)>
    <!-- Book Wings Silhouette -->
    <path d=M 50 120 C 68 114 84 118 96 126 C 108 118 124 114 142 120 L 142 68 C 124 62 108 66 96 74 C 84 66 68 62 50 68 Z fill=#2e1065 fill-opacity=0.7 stroke=url(#primaryPurple192) stroke-width=2/>

    <!-- Central Audio Waveform Equalizer -->
    <g fill=url(#waveGrad192)>
      <rect x=58 y=78 width=7 height=34 rx=3.5/>
      <rect x=71 y=64 width=7 height=62 rx=3.5/>
      <rect x=84 y=52 width=7 height=86 rx=3.5/>
      <rect x=97 y=56 width=7 height=78 rx=3.5/>
      <rect x=110 y=68 width=7 height=54 rx=3.5/>
      <rect x=123 y=82 width=7 height=26 rx=3.5/>
    </g>
  </g>

  <!-- Monogram Label -->
  <text x=96 y=162 font-family=-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif font-size=20 font-weight=900 fill=#f4f4f5 text-anchor=middle letter-spacing=3>ENRESUMIDO</text>
</svg>
