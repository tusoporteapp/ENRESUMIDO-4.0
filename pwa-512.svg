<svg xmlns=http://www.w3.org/2000/svg viewBox=0 0 512 512 width=512 height=512>
  <defs>
    <linearGradient id=bgGrad512 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#1a0b2e/>
      <stop offset=50% stop-color=#0f071d/>
      <stop offset=100% stop-color=#09090b/>
    </linearGradient>
    <linearGradient id=primaryPurple512 x1=0% y1=0% x2=100% y2=100%>
      <stop offset=0% stop-color=#c084fc/>
      <stop offset=50% stop-color=#8b5cf6/>
      <stop offset=100% stop-color=#4f46e5/>
    </linearGradient>
    <linearGradient id=waveGrad512 x1=0% y1=100% x2=0% y2=0%>
      <stop offset=0% stop-color=#c4b5fd/>
      <stop offset=50% stop-color=#ffffff/>
      <stop offset=100% stop-color=#f5f3ff/>
    </linearGradient>
    <radialGradient id=glowRadial512 cx=50% cy=45% r=50%>
      <stop offset=0% stop-color=#7c3aed stop-opacity=0.35/>
      <stop offset=60% stop-color=#6d28d9 stop-opacity=0.1/>
      <stop offset=100% stop-color=#09090b stop-opacity=0/>
    </radialGradient>
    <filter id=glowFilter512 x=-20% y=-20% width=140% height=140%>
      <feGaussianBlur stdDeviation=16 result=blur/>
      <feComposite in=SourceGraphic in2=blur operator=over/>
    </filter>
  </defs>

  <!-- Background Box -->
  <rect width=512 height=512 rx=116 fill=url(#bgGrad512)/>
  <rect x=8 y=8 width=496 height=496 rx=108 fill=none stroke=url(#primaryPurple512) stroke-width=5 stroke-opacity=0.5/>

  <!-- Ambient Glow Center -->
  <circle cx=256 cy=235 r=170 fill=url(#glowRadial512)/>

  <!-- Main Symbol (Book & Waves) -->
  <g transform=translate(0, -15)>
    <!-- Book Base Silhouette -->
    <path d=M 130 310 C 180 295 225 305 256 325 C 287 305 332 295 382 310 L 382 170 C 332 155 287 165 256 185 C 225 165 180 155 130 170 Z fill=#240c4a fill-opacity=0.75 stroke=url(#primaryPurple512) stroke-width=5/>

    <!-- Equalizer Sound Wave Bars -->
    <g fill=url(#waveGrad512) filter=url(#glowFilter512)>
      <rect x=154 y=200 width=18 height=85 rx=9/>
      <rect x=188 y=165 width=18 height=155 rx=9/>
      <rect x=222 y=130 width=18 height=225 rx=9/>
      <rect x=256 y=140 width=18 height=205 rx=9/>
      <rect x=290 y=175 width=18 height=135 rx=9/>
      <rect x=324 y=210 width=18 height=65 rx=9/>
    </g>
  </g>

  <!-- Wordmark -->
  <text x=256 y=420 font-family=-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif font-size=44 font-weight=900 fill=#ffffff text-anchor=middle letter-spacing=7>ENRESUMIDO</text>
  <text x=256 y=455 font-family=-apple-system, BlinkMacSystemFont, 'Plus Jakarta Sans', 'Segoe UI', Roboto, sans-serif font-size=16 font-weight=700 fill=#a78bfa text-anchor=middle letter-spacing=4>AUDIO RESÚMENES</text>
</svg>
